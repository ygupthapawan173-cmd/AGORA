name: Apply JARVIS v0.2.0 source archive

on:
  push:
    branches: [ jarvis-red-white-ui ]
    paths: [ 'jarvis-v0.2.0-source.tar.xz.b64' ]

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source archive commit
        uses: actions/checkout@v4
        with:
          ref: jarvis-red-white-ui
          persist-credentials: true

      - name: Apply source archive
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cat jarvis-v020-source.part01 jarvis-v020-source.part02 jarvis-v020-source.part03 jarvis-v020-source.part04 jarvis-v020-source.part05 jarvis-v020-source.part06 jarvis-v0.2.0-source.tar.xz.b64 > "$tmp/source.tar.xz.b64"
          base64 -d "$tmp/source.tar.xz.b64" > "$tmp/source.tar.xz"
          tar -xJf "$tmp/source.tar.xz" -C "$tmp"
          source_dir="$tmp/AGORA-jarvis-red-white-ui"
          test -f "$source_dir/app/src/main/AndroidManifest.xml"
          rsync -a --delete --exclude='.git/' --exclude='jarvis-v0.2.0-source.tar.xz.b64' --exclude='jarvis-v020-source.part*' "$source_dir/" ./
          rm -rf "$tmp"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Commit applied source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "JARVIS AI v0.2.0: multi-provider, futuristic UI and accessibility"
            git push origin HEAD:jarvis-red-white-ui
          fi

      - name: Upload v0.2.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v0.2.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
